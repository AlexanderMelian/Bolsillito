services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bolsillito
      POSTGRES_PASSWORD: bolsillito
      POSTGRES_DB: bolsillito
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolsillito"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bolsillito.dev
      PGADMIN_DEFAULT_PASSWORD: bolsillito
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://bolsillito:bolsillito@db:5432/bolsillito
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
